<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Yu Gothic";
        src: local("Yu Gothic Medium"), local("Yu Gothic");
      }
      @font-face {
        font-family: "Yu Mincho";
        src: local("Yu Mincho Demibold"), local("Yu Mincho");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      body {
        font-family: "Yu Gothic", sans-serif;
      }
      #root {
        position: relative;
        overflow: hidden;
        background: #17110c;
      }
      /* 1920x1200(16:10)素材 → 16:9へcoverクロップ。scale(1.02)で右端のスクロールバーを画面外へ */
      #root video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(1.02);
      }
      .zoomwrap {
        position: absolute;
        inset: 0;
      }
      .telop {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 64px;
        display: flex;
        justify-content: center;
        pointer-events: none;
      }
      .telop-inner {
        background: rgba(23, 17, 12, 0.82);
        border: 2px solid #b8923f;
        border-radius: 14px;
        padding: 14px 48px;
        color: #f4e8d0;
        font-family: "Yu Mincho", serif;
        font-weight: 700;
        font-size: 46px;
        letter-spacing: 0.12em;
      }
      .telop-inner .accent {
        color: #e8d5a8;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="40"
      data-width="1920"
      data-height="1080"
    >
      <!-- 場面1a (0-4s): 3D絵本ヒーロー（タイトル） -->
      <video
        id="scene1a-hero"
        class="clip"
        src="assets/raw.mp4"
        data-start="0"
        data-duration="4"
        data-media-start="3"
        data-track-index="0"
        muted
        playsinline
      ></video>

      <!-- 場面1b (4-10s): 3D絵本ヒーロー（絵本スクロール） -->
      <video
        id="scene1b-hero"
        class="clip"
        src="assets/raw.mp4"
        data-start="4"
        data-duration="6"
        data-media-start="31"
        data-track-index="0"
        muted
        playsinline
      ></video>

      <!-- 場面2 (10-15s): 診断1問（お金の使い方→回答→ページ捲り） -->
      <video
        id="scene2-question"
        class="clip"
        src="assets/raw.mp4"
        data-start="10"
        data-duration="5"
        data-media-start="60"
        data-track-index="0"
        muted
        playsinline
      ></video>

      <!-- 場面3 (15-26s): 本が閉じて結果リビール（港区ちゃん・にてる度カウントアップ→特徴） -->
      <video
        id="scene3-result"
        class="clip"
        src="assets/raw.mp4"
        data-start="15"
        data-duration="11"
        data-media-start="79.5"
        data-track-index="0"
        muted
        playsinline
      ></video>

      <!-- 場面4 (26-40s): 区詳細の実数値スクロール→出典で静止（26-33sにズーム） -->
      <div class="zoomwrap" id="scene4-zoom">
        <video
          id="scene4-detail"
          class="clip"
          src="assets/raw.mp4"
          data-start="26"
          data-duration="14"
          data-media-start="130"
          data-track-index="0"
          muted
          playsinline
        ></video>
      </div>

      <!-- テロップ -->
      <div class="clip telop" id="telop1-clip" data-start="10.4" data-duration="4.2" data-track-index="1">
        <div class="telop-inner" id="telop1">10問に答える</div>
      </div>
      <div class="clip telop" id="telop2-clip" data-start="15.8" data-duration="9.7" data-track-index="1">
        <div class="telop-inner" id="telop2">あなたに<span class="accent">一番似ている区</span>と出会う</div>
      </div>
      <div class="clip telop" id="telop3-clip" data-start="26.4" data-duration="9.1" data-track-index="1">
        <div class="telop-inner" id="telop3">オープンデータの<span class="accent">実数値と出典</span></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // テロップの出入り（クリップ内側の要素を動かす）
      tl.fromTo("#telop1", { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, 10.4);
      tl.to("#telop1", { autoAlpha: 0, duration: 0.4 }, 14.1);
      tl.fromTo("#telop2", { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, 15.8);
      tl.to("#telop2", { autoAlpha: 0, duration: 0.4 }, 25.0);
      tl.fromTo("#telop3", { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, 26.4);
      tl.to("#telop3", { autoAlpha: 0, duration: 0.4 }, 35.0);
      // 場面4-1: 実数値バーへ寄る（26.8-29s、1.55倍）→ スクロールを見せるため戻す（32.5-34.5s）
      tl.fromTo(
        "#scene4-zoom",
        { scale: 1, transformOrigin: "62% 45%" },
        { scale: 1.55, duration: 2.2, ease: "power2.inOut" },
        26.8
      );
      tl.to("#scene4-zoom", { scale: 1, duration: 2, ease: "power2.inOut" }, 32.5);
      // 場面4-2: 最重要の「出典」へ大きく寄って終わる（37-39.2s、2.1倍で40sまで保持）
      // scale=1の時点で原点を出典ブロックへ移す（見た目の変化なし）
      // 原点は「可視窓の中心が出典カード中心に来る」よう逆算した値。
      // 可視窓 = [o - o/s, o + (1-o)/s] なので、中心を合わせるには o = (2*c*s - 1) / (2*s - 2)。
      // 出典カード中心 c ≒ (0.617, 0.723)、s = 2.1 → o ≒ (0.71, 0.91)
      tl.set("#scene4-zoom", { transformOrigin: "71% 91%" }, 35.2);
      tl.to("#scene4-zoom", { scale: 2.1, duration: 2.2, ease: "power2.inOut" }, 37);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
